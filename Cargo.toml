[package]
name = "tagtool"
version = "0.1.0"
description = "Find files by tags"
authors = ["tczyz <tomczyz97@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29.0"
color-eyre = "0.6.3"
directories = "6.0.0"
clap = { version = "4.5.42", features = ["cargo", "derive"] }
fuzzy-matcher = "0.3.7"
once_cell = "1.21.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "chrono"] }
log = "0.4.27"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros"] }
env_logger = "0.11.8"
blake3 = { version = "1.8.2", features = ["mmap"] }
same-file = "1.0.6"
getrandom = "0.2.16"
base64 = "0.22.1"
rand = "0.8.5"
sha2 = "0.10.9"
ureq = "3.1.2"
open = "5.3.2"
form_urlencoded = "1.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
