[package]
name = "tagtool"
version = "0.1.0"
description = "Find files by tags"
authors = ["tczyz <tomczyz97@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
esrs = "0.18.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros"] }
once_cell = "1.21.3"
fuzzy-matcher = "0.3.7"
ureq = "3.1.2"
open = "5.3.2"
async-trait = "0.1.89"
futures = "0.3.31"

# terminal etc.
clap = { version = "4.5.42", features = ["cargo", "derive"] }
crossterm = "0.29.0"
ratatui = "0.29.0"
tui-input = "0.14.0"
color-eyre = { version = "0.6", default-features = false }

# logging
log = "0.4.27"
tracing = "0.1.41"
env_logger = "0.11.8"

# simple utils
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
uuid = { version = "1.6", features = ["serde", "v7"] }
rand = "0.9.2"
directories = "6.0.0"
same-file = "1.0.6"
base64 = "0.22.1"
sha2 = "0.10.9"
blake3 = { version = "1.8.2", features = ["mmap", "serde"] }
thiserror = "2.0.17"
dashmap = "6.1.0"
form_urlencoded = "1.2.2"
